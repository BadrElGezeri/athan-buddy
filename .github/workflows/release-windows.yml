name: Release signed Windows update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already set in package.json, for example 0.2.0
        required: true
        type: string
      release_notes:
        description: Plain-text features and fixes shown inside Athan Buddy
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: production
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ inputs.version }}
      WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - name: Check out the protected release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.1
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version, signing identity, and release credentials
        run: node scripts/validate-release.cjs

      - name: Typecheck and build
        run: pnpm build

      - name: Build, sign, and upload the draft release
        run: pnpm release:win

      - name: Attest the signed installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/Athan-Buddy-Setup-${{ inputs.version }}.exe

      - name: Publish the immutable-ready release
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: gh release edit "v$env:RELEASE_VERSION" --draft=false --latest --notes "$env:RELEASE_NOTES"
