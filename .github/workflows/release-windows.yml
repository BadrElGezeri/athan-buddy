name: Release Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already set in package.json, for example 0.2.0
        required: true
        type: string
      release_notes:
        description: Plain-text features and fixes shown inside Athan Buddy
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: production
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out the protected release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version and release credentials
        run: node scripts/validate-release.cjs

      - name: Build the Windows installer
        run: pnpm release:win

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = "release/Athan-Buddy-Setup-$env:RELEASE_VERSION.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash *Athan-Buddy-Setup-$env:RELEASE_VERSION.exe" | Set-Content -Encoding ascii "release/Athan-Buddy-Setup-$env:RELEASE_VERSION.exe.sha256"

      - name: Attest the installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/Athan-Buddy-Setup-${{ inputs.version }}.exe

      - name: Create the draft release with all assets
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $notice = "Unsigned Windows build: Windows may show an Unknown Publisher or SmartScreen warning. Download only from this official repository and verify the SHA-256 file."
          $notes = "$notice`n`n$env:RELEASE_NOTES"
          gh release create "v$env:RELEASE_VERSION" --draft --title "Athan Buddy $env:RELEASE_VERSION" --notes "$notes" "release/Athan-Buddy-Setup-$env:RELEASE_VERSION.exe" "release/Athan-Buddy-Setup-$env:RELEASE_VERSION.exe.sha256"

      - name: Publish the immutable-ready release
        shell: pwsh
        run: gh release edit "v$env:RELEASE_VERSION" --draft=false --latest
